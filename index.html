<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meine Mini-Spiele</title>
<style>
  body { font-family: system-ui, sans-serif; background: #fff6ea; color: #2a1f3d; margin: 0; padding: 24px; }
  h1 { margin-top: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
  a.card { display: block; background: #fff; border-radius: 20px; padding: 20px; text-decoration: none; color: inherit; box-shadow: 0 4px 0 rgba(42,31,61,.1); }
  a.card:hover { transform: translateY(-2px); }
  a.card b { font-size: 22px; color: #f0387a; }
</style>
</head>
<body>
  <h1>Meine Mini-Spiele</h1>
  <div class="grid">
    <a class="card" href="plink/"><b>Plink!</b><br>Vier in einer Reihe gegen 10 Gegner</a>
  </div>
</body>
</html>
